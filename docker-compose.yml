services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-7b345529b24bfffc8a0dbc2c08ea0142518623ea7e570271e3a6a2863a43ca7c}
      MYSQL_DATABASE: forma
      MYSQL_USER: forma_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-c0867d22ba799f899303f8ba6dc2f1b0569e122536fdff8cbee822b751b935cc}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - forma_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  forma_mysql_data:
